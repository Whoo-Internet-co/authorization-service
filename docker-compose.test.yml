# Infra mínima para testes de integração (DynamoDB Local com Streams).
#   docker compose -f docker-compose.test.yml up -d
#   npm run test:integration
# Os testes criam/destroem as próprias tabelas (helper ensureTables) contra
# http://localhost:8000.

services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
